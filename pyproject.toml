[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redminebot"
version = "1.0.0"
description = "Links GitLab commits to Redmine issues, with a small admin web UI"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
